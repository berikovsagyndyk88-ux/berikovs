<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сағат Анимациясы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="clock">

    <span class="number num-12">12</span>
    <span class="number num-3">3</span>
    <span class="number num-6">6</span>
    <span class="number num-9">9</span>

    <div class="hand hour-hand"></div>
    <div class="hand minute-hand"></div>
    <div class="hand second-hand"></div>

    <div class="center-dot"></div>
  </div>

</body>
</html>
